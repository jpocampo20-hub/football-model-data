name: Bajada historica de xG (una sola vez)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install soccerdata pandas
      - name: Bajar historico de xG
        run: python fetch_understat_historical.py
      - name: Guardar archivo en GitHub
        run: |
          git config user.name "bet-model-bot"
          git config user.email "bot@users.noreply.github.com"
          git add understat_historical.csv
          git commit -m "Bajada historica de xG (Understat, 2016-2026)" || echo "sin cambios"
          git pull --rebase origin main
          git push
