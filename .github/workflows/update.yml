name: Actualizar partidos

on:
  schedule:
    - cron: "0 6 * * 1"   # todos los lunes 06:00 UTC (~1am/2am Colombia)
  workflow_dispatch: {}    # permite tambien correrlo manual con un boton

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bajar partidos
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python fetch_fixtures.py
      - name: Guardar cambios
        run: |
          git config user.name "bet-model-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fixtures.csv
          git commit -m "Actualizar partidos $(date +%F)" || echo "sin cambios nuevos"
          git push
