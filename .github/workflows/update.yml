name: Actualizar partidos y metricas cuantitativas

on:
  schedule:
    - cron: "0 6 * * 1"   # Todos los lunes a las 06:00 UTC (~1am / 2am Colombia)
  workflow_dispatch:      # Permite la ejecucion manual desde el boton en GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias requeridas
        run: |
          python -m pip install --upgrade pip
          pip install kaggle soccerdata pandas requests

      - name: Running script 1 - Partidos principales
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python fetch_fixtures.py

      - name: Running script 3 - Metricas xG individuales
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python fetch_xg_stats.py

      - name: Running script 4 - Cuotas de apuestas
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds.py

      - name: Running script 5 - Metricas avanzadas Understat
        continue-on-error: true
        run: python fetch_understat.py

      - name: Guardar y sincronizar todos los CSVs en GitHub
        run: |
          git config user.name "bet-model-bot"
          git config user.email "bot@users.noreply.github.com"

          for f in fixtures.csv player_stats_xg.csv odds_data.csv understat_metrics.csv; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "Añadido $f al commit."
            fi
          done

          git commit -m "Actualización automatica de datos $(date +%F)" || echo "No se detectaron cambios nuevos."
          git pull --rebase origin main
          git push
