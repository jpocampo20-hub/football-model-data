name: Actualizar partidos

on:
  schedule:
    - cron: "0 6 * * 1"   # todos los lunes 06:00 UTC (~1am Colombia)
  workflow_dispatch: {}    # permite correrlo manual con el botón

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias requeridas
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Bajar partidos (5 ligas + Champions League)
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python fetch_fixtures.py

      - name: Bajar copas domesticas y Europa League
        continue-on-error: true
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python fetch_cups_europe.py

      - name: Bajar stats con xG (Kaggle)
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python fetch_xg_stats.py

      - name: Guardar cambios
        run: |
          git config user.name "bet-model-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in fixtures.csv cups_europe.csv player_stats_xg.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Actualizar datos $(date +%F)" || echo "sin cambios nuevos"
          git pull --rebase origin main
          git push
